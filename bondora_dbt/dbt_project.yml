# dbt project for the Bondora credit-risk capstone (loans issued 2023–2025)
name: 'bondora_dbt'
version: '1.0.0'

# Connection settings come from the profile 'bondora_dbt' in ~/.dbt/profiles.yml
# (kept outside the repo, so the database password is never pushed to GitHub)
profile: 'bondora_dbt'

# Where dbt finds each type of file
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]          # custom tests, e.g. assert_cross_segment_totals.sql
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Folders removed by `dbt clean`
clean-targets:
  - "target"
  - "dbt_packages"

# How each layer is built in PostgreSQL (schema: analytics)
models:
  bondora_dbt:
    staging:
      +materialized: view      # stg_loans: light cleaning, always up to date
    marts:
      +materialized: table     # fct_loans and the kpi_ tables: fast for Tableau